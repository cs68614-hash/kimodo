name: Deploy ARDY ZeroGPU Space

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/ardy-zero-gpu
    paths:
      - ardy_deploy/**
      - .github/workflows/deploy-ardy-space.yml

permissions:
  contents: read

concurrency:
  group: deploy-ardy-zero-gpu
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade "huggingface_hub>=1.0"

      - name: Build and deploy ARDY Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          from huggingface_hub import HfApi

          root = Path.cwd()
          build_dir = Path(tempfile.mkdtemp(prefix="ardy-space-"))
          source_dir = build_dir / "space"

          subprocess.run(
              [
                  "git",
                  "clone",
                  "--depth",
                  "1",
                  "https://huggingface.co/spaces/hugging-apps/ardy",
                  str(source_dir),
              ],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "-C",
                  str(source_dir),
                  "apply",
                  str(root / "ardy_deploy" / "ardy-space.patch"),
              ],
              check=True,
          )
          subprocess.run(
              [
                  "git",
                  "-C",
                  str(source_dir),
                  "apply",
                  "--recount",
                  str(root / "ardy_deploy" / "ardy-timeline.patch"),
              ],
              check=True,
          )
          readme_path = source_dir / "README.md"
          readme_text = readme_path.read_text(encoding="utf-8")
          if not readme_text.startswith("---\n"):
              raise RuntimeError("Space README.md has no YAML frontmatter")
          frontmatter_end = readme_text.find("\n---", 4)
          if frontmatter_end < 0:
              raise RuntimeError("Space README.md frontmatter is not closed")
          frontmatter = readme_text[:frontmatter_end]
          body = readme_text[frontmatter_end:]

          if "startup_duration_timeout:" in frontmatter:
              import re
              frontmatter = re.sub(
                  r"(?m)^startup_duration_timeout:.*$",
                  "startup_duration_timeout: 1h",
                  frontmatter,
              )
          else:
              frontmatter += "\nstartup_duration_timeout: 1h"

          if "preload_from_hub:" not in frontmatter:
              frontmatter += (
                  "\npreload_from_hub:\n"
                  "  - unsloth/llama-3-8b-Instruct\n"
                  "  - McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp\n"
                  "  - McGill-NLP/LLM2Vec-Meta-Llama-3-8B-Instruct-mntp-supervised"
              )

          readme_path.write_text(frontmatter + body, encoding="utf-8")

          subprocess.run(
              [
                  "python",
                  str(source_dir / "tests" / "test_timeline_utils.py"),
              ],
              check=True,
              env={**os.environ, "PYTHONPATH": str(source_dir)},
          )
          subprocess.run(
              [
                  "python",
                  "-m",
                  "py_compile",
                  str(source_dir / "app.py"),
                  str(source_dir / "timeline_utils.py"),
              ],
              check=True,
          )
          shutil.rmtree(source_dir / ".git", ignore_errors=True)

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          username = api.whoami()["name"]
          repo_id = f"{username}/ardy-motion-api"

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
          )
          api.add_space_secret(repo_id=repo_id, key="HF_TOKEN", value=token)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=str(source_dir),
              ignore_patterns=[
                  ".git/**",
                  "**/__pycache__/**",
                  "**/*.pyc",
              ],
              commit_message="Deploy ARDY ZeroGPU Blender motion API",
          )
          api.request_space_hardware(repo_id=repo_id, hardware="zero-a10g")
          print(f"Space deployed to https://huggingface.co/spaces/{repo_id}")
          PY

      - name: Verify ARDY Space runtime
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time

          import httpx
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          username = api.whoami()["name"]
          repo_id = f"{username}/ardy-motion-api"

          stage = "BUILDING"
          runtime_error_count = 0
          for _ in range(360):
              stage = api.get_space_runtime(repo_id).stage
              print(f"Space stage: {stage}", flush=True)
              if stage == "RUNNING":
                  break
              if stage == "BUILD_ERROR":
                  break
              if stage == "RUNTIME_ERROR":
                  runtime_error_count += 1
                  if runtime_error_count >= 12:
                      break
              else:
                  runtime_error_count = 0
              time.sleep(10)

          if stage != "RUNNING":
              log_kind = "run" if stage == "RUNTIME_ERROR" else "build"
              response = httpx.get(
                  f"https://huggingface.co/api/spaces/{repo_id}/logs/{log_kind}",
                  headers={"Authorization": f"Bearer {token}"},
                  timeout=30,
              )
              print(response.text[-30000:])
              raise SystemExit(f"Space did not become RUNNING (stage={stage})")
          PY

name: Deploy GEM-X Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/gem-x-zero-gpu
    paths:
      - gem_x_deploy/**
      - .github/workflows/deploy-gem-x-space.yml

permissions:
  contents: read

concurrency:
  group: deploy-gem-x-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble GEM-X Space source
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 https://github.com/NVlabs/GEM-X.git space
          git clone --depth 1 https://github.com/NVlabs/SOMA-X.git space/third_party/soma
          git -C space/third_party/soma lfs pull --include="assets/SOMA_neutral.npz,assets/SOMA_template_rig.usda,assets/correctives_model.pt"
          env -u GIT_LFS_SKIP_SMUDGE git clone --depth 1 https://github.com/NVIDIA/soma-retargeter.git retargeter
          mkdir -p space/inputs/soma_assets
          cp space/third_party/soma/assets/SOMA_neutral.npz space/inputs/soma_assets/SOMA_neutral.npz
          cp space/third_party/soma/assets/SOMA_template_rig.usda space/inputs/soma_assets/SOMA_template_rig.usda
          cp space/third_party/soma/assets/SOMA_procedural_transforms.json space/inputs/soma_assets/SOMA_procedural_transforms.json
          cp space/third_party/soma/assets/correctives_model.pt space/inputs/soma_assets/correctives_model.pt
          cp retargeter/soma_retargeter/configs/soma/soma_zero_frame0.bvh space/assets/soma_zero_frame0.bvh
          cp gem_x_deploy/README.md space/README.md
          cp gem_x_deploy/app.py space/app.py
          cp gem_x_deploy/space_runner.py space/space_runner.py
          cp gem_x_deploy/space_bvh.py space/space_bvh.py
          cp gem_x_deploy/requirements.txt space/requirements.txt
          cp gem_x_deploy/packages.txt space/packages.txt
          find space -name .git -type d -prune -exec rm -rf {} +

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade "huggingface_hub>=1.0"

      - name: Create and deploy ZeroGPU Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          username = api.whoami()["name"]
          repo_id = f"{username}/gem-x-motion-capture"

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
          )
          api.add_space_secret(repo_id=repo_id, key="HF_TOKEN", value=token)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="space",
              ignore_patterns=[
                  "**/__pycache__/**",
                  "**/*.pyc",
                  "assets/*.gif",
                  "third_party/**/assets/**",
                  "third_party/**/docs/**",
                  "third_party/**/tests/**",
              ],
              commit_message="Deploy GEM-X ZeroGPU motion capture",
          )
          api.request_space_hardware(repo_id=repo_id, hardware="zero-a10g")
          print(f"Space deployed to https://huggingface.co/spaces/{repo_id}")
          PY

      - name: Verify Space build
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import time

          import httpx
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          username = api.whoami()["name"]
          repo_id = f"{username}/gem-x-motion-capture"

          stage = "BUILDING"
          for _ in range(24):
              runtime = api.get_space_runtime(repo_id)
              stage = runtime.stage
              print(f"Space stage: {stage}", flush=True)
              if stage in {"RUNNING", "BUILD_ERROR", "RUNTIME_ERROR"}:
                  break
              time.sleep(10)

          if stage != "RUNNING":
              log_kind = "run" if stage == "RUNTIME_ERROR" else "build"
              response = httpx.get(
                  f"https://huggingface.co/api/spaces/{repo_id}/logs/{log_kind}",
                  headers={"Authorization": f"Bearer {token}"},
                  timeout=30,
              )
              print(response.text[-30000:])
              raise SystemExit(f"Space did not become RUNNING (stage={stage})")
          PY

      - name: Run authenticated motion smoke test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ffmpeg -y -loglevel error -i space/assets/demo_2d_keypoints.gif -t 2 -vf "fps=15,scale=480:-2" -an -c:v libx264 -pix_fmt yuv420p /tmp/gemx-smoke.mp4
          python - <<'PY'
          import json
          import os

          import httpx

          base = "https://cs686-gem-x-motion-capture.hf.space"
          headers = {"Authorization": f"Bearer {os.environ['HF_TOKEN']}"}
          with open("/tmp/gemx-smoke.mp4", "rb") as handle:
              upload = httpx.post(
                  f"{base}/gradio_api/upload",
                  headers=headers,
                  files={"files": ("gemx-smoke.mp4", handle, "video/mp4")},
                  timeout=60,
              )
          upload.raise_for_status()
          remote_path = upload.json()[0]
          response = httpx.post(
              f"{base}/gradio_api/call/v2/capture_motion",
              headers=headers,
              json={
                  "video_path": {
                      "path": remote_path,
                      "meta": {"_type": "gradio.FileData"},
                  },
                  "camera_mode": "固定相机",
                  "use_ddim": False,
              },
              timeout=60,
          )
          response.raise_for_status()
          event_id = response.json()["event_id"]

          completed = False
          with httpx.stream(
              "GET",
              f"{base}/gradio_api/call/capture_motion/{event_id}",
              headers=headers,
              timeout=180,
          ) as stream:
              stream.raise_for_status()
              for line in stream.iter_lines():
                  if line:
                      print(line, flush=True)
                  if line == "event: complete":
                      completed = True
                  if line == "event: error":
                      raise SystemExit("Authenticated GEM-X smoke test failed")
          if not completed:
              raise SystemExit("Authenticated GEM-X smoke test ended without completion")
          PY
